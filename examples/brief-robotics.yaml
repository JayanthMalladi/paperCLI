schema_version: '1.0'
question: 'A mobile manipulator is being designed: a wheeled base carries two 7-DOF arms that grasp and reorient objects with suction, and the whole behaviour has so far been validated in simulation. Is the proposed actuation - backdrivable (series-elastic) actuators on most joints plus a counterbalance spring at the shoulder - supported by published practice for this class of robot? And when such a system moves from simulation to hardware, which parts of the demonstrated performance (localisation accuracy, force behaviour of the two-handed grip, power draw) can be expected to carry over, and which are known to degrade, per the literature?'
purpose: 'Thesis background and research-gap identification'
review_type: narrative
scope: 'Robotics: mobile manipulators, dexterous two-arm systems with suction grasping, actuator selection (backdrivable / series-elastic), sim-to-hardware transfer; English, 2015 onward, preprints included'
date_range: {from: null, to: null}
languages: [en]
include_preprints: true
seed_identifiers: []
