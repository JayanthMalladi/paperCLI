[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-papercli"
version = "0.1.0"
description = "PaperCLI: agent-driven, evidence-backed literature review CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jayanth" }]
keywords = ["literature-review", "research", "cli", "agent", "citations"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Pinned runtime dependencies. tomllib is stdlib on 3.11+; on 3.10 we need
# tomli, so it is a conditional dependency. Click is deliberately NOT used --
# the CLI is built on stdlib argparse (documented choice, see README).
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "jsonschema==4.26.0",
    "tomli==2.2.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Exporters (Phase 7 preflight will report these as available/missing).
exports = [
    "python-docx==1.2.0",
    "pypandoc-binary==1.14.1",
]
# JSON schema validation beyond the stdlib-structural fallback.
schemas = [
    "jsonschema==4.26.0",
]
dev = [
    "pytest==8.3.4",
    "coverage==7.6.1",
]

[project.scripts]
papers = "papercli.cli.main:cli_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"papercli.agent_contract.schemas" = ["*.json"]
"papercli.storage.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/papercli"]

[tool.coverage.report]
show_missing = true
